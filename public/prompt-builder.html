<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARUPICK Prompt Builder — 코디 추천 + 이미지 프롬프트 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #C4622D;
    --accent-hover: #A8512A;
    --bg: linear-gradient(165deg, #F7F3EE 0%, #EDE7DF 50%, #E8E0D6 100%);
    --card: rgba(255,255,255,0.4);
    --card-border: rgba(255,255,255,0.6);
    --stone-50: #fafaf9; --stone-100: #f5f5f4; --stone-200: #e7e5e4;
    --stone-300: #d6d3d1; --stone-400: #a8a29e; --stone-500: #78716c;
    --stone-600: #57534e; --stone-700: #44403c; --stone-800: #292524;
  }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--stone-700);
    -webkit-font-smoothing: antialiased;
  }
  .playfair { font-family: 'Playfair Display', serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  .header { padding: 24px 0 12px; }
  .header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .logo-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); }
  .logo-sub { font-size: 10px; letter-spacing: 0.2em; color: var(--stone-400); font-weight: 500; margin-top: 2px; }
  .header-desc { font-size: 12px; color: var(--stone-500); margin-left: 36px; }

  /* Card */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-title { font-size: 14px; font-weight: 700; color: var(--stone-700); margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--stone-400); margin-bottom: 12px; }

  /* Back button */
  .back-btn {
    display: flex; align-items: center; gap: 4px; margin-bottom: 12px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--stone-500);
  }
  .back-btn:hover { color: var(--stone-700); }

  /* Mood grid */
  .mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mood-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 8px; border-radius: 14px;
    border: 1px solid rgba(231,229,228,0.8); background: rgba(255,255,255,0.7);
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .mood-btn:hover { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .mood-btn .icon { font-size: 24px; }
  .mood-btn .name { font-size: 13px; font-weight: 700; color: var(--stone-800); }
  .mood-btn .desc { font-size: 10px; color: var(--stone-400); }

  /* Style list */
  .style-list { display: flex; flex-direction: column; gap: 8px; }
  .style-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; border-radius: 12px; text-align: left;
    border: 1px solid rgba(231,229,228,0.8); background: rgba(255,255,255,0.7);
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .style-btn:hover { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .style-btn .s-icon { font-size: 20px; }
  .style-btn .s-name { font-size: 13px; font-weight: 700; color: var(--stone-800); }
  .style-btn .s-sub { font-size: 10px; color: var(--stone-400); }

  /* Item chips */
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stone-400); margin-bottom: 6px; }
  .chip {
    padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .chip.off { background: var(--stone-100); color: var(--stone-600); }
  .chip.off:hover { background: var(--stone-200); }
  .chip.on { background: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(196,98,45,0.3); }

  /* Full-width buttons */
  .btn-primary {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    font-family: inherit; font-size: 13px; font-weight: 700;
    background: var(--accent); color: #fff; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-dark {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    font-family: inherit; font-size: 13px; font-weight: 700;
    background: var(--stone-800); color: #fff; cursor: pointer; transition: background 0.15s;
  }
  .btn-dark:hover { background: #1c1917; }

  /* Summary box */
  .summary-box {
    font-size: 12px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px;
    background: rgba(196,98,45,0.08); color: var(--accent);
  }

  /* Result outfit color blocks */
  .outfit-block {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 10px; margin-bottom: 5px;
  }
  .outfit-block .part-tag {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
    background: rgba(0,0,0,0.15);
  }
  .outfit-block .color-name { font-size: 12px; font-weight: 600; }
  .light-border { border: 1px solid #d1d1d1 !important; }

  /* Nav row */
  .nav-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
  .nav-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--stone-100); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:hover:not(:disabled) { background: var(--stone-200); }
  .dot-nav { display: flex; gap: 4px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; border: none; cursor: pointer; transition: background 0.15s; }
  .dot.on { background: var(--accent); }
  .dot.off { background: var(--stone-300); }

  /* Toggle row (style / gender) */
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 10px 8px; border-radius: 12px; text-align: center;
    border: 1px solid rgba(231,229,228,0.8); cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .toggle-btn.off { background: rgba(255,255,255,0.7); color: var(--stone-600); }
  .toggle-btn.off:hover { background: #fff; }
  .toggle-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(196,98,45,0.25); }
  .toggle-btn .t-label { font-size: 12px; font-weight: 700; }
  .toggle-btn .t-desc { font-size: 10px; margin-top: 2px; }
  .toggle-btn.on .t-desc { color: rgba(255,255,255,0.7); }
  .toggle-btn.off .t-desc { color: var(--stone-400); }

  /* Prompt output */
  .prompt-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .copy-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit; transition: all 0.2s;
    background: var(--accent); color: #fff;
  }
  .copy-btn:hover { background: var(--accent-hover); }
  .copy-btn.copied { background: #22c55e; }
  .prompt-box {
    padding: 12px; border-radius: 12px; background: var(--stone-50);
    border: 1px solid rgba(231,229,228,0.8);
  }
  .prompt-text {
    font-size: 12px; color: var(--stone-700); line-height: 1.7;
    word-break: break-all; user-select: all;
  }
  .prompt-hint {
    margin-top: 8px; display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--stone-400);
  }

  /* Refresh btn */
  .refresh-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
    background: var(--stone-100); color: var(--stone-600); border: none;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--stone-200); }

  .hidden { display: none !important; }

  /* Result header row */
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .result-counter { font-size: 12px; font-weight: 700; color: var(--stone-800); }
  .result-info { text-align: center; margin-bottom: 10px; }
  .result-name { font-size: 14px; font-weight: 700; color: var(--stone-800); }
  .result-score { font-size: 11px; color: var(--stone-400); }
</style>

function getHueDiff(h1,h2) { let d=Math.abs(h1-h2); if(d>180)d=360-d; return d; }
function isNeutralColor(c) { return c<=12; }
function getToneGroup(h,c,l) { if(c<=12)return'neutral'; if(l<=35)return'deep'; if(l>=75)return'light'; if(c>=60)return'bright'; return'muted'; }
function getColorTemperature(h,c,l) {
  if(c<=12) return{temp:'neutral',score:0};
  let ws=0;
  if((h>=0&&h<=70)||(h>=320&&h<=360)){const a=h>=320?h-360:h;ws=1.0-Math.abs(a-30)/70;}
  else if(h>=200&&h<=280){ws=-1.0+Math.abs(h-240)/80;}
  if(c<30)ws*=0.5;
  let t; if(ws>0.3)t='warm'; else if(ws<-0.3)t='cool'; else t='neutral';
  return{temp:t,score:ws};
}

function itemsToLayerInfo(itemIds) {
  const items = itemIds.map(id => ITEMS_CATALOG.find(i => i.id === id)).filter(Boolean);
  const sorted = [...items].sort((a,b) => b.outerness - a.outerness);
  let hasOuter=false,hasMid=false,hasScarf=false,hasHat=false;
  let outerType='coat',midType='knit';
  for (const item of sorted) {
    if (item.outerType) { hasOuter=true; outerType=item.outerType; }
    else if (item.midType) { hasMid=true; midType=item.midType; }
    else if (item.slot==='scarf') { hasScarf=true; }
    else if (item.slot==='hat') { hasHat=true; }
  }
  let layerType='simple';
  if (hasOuter&&hasMid&&hasScarf) layerType='full';
  else if (hasOuter&&hasMid) layerType='layered';
  else if (hasScarf&&hasOuter) layerType='scarf_basic';
  else if (hasScarf&&hasMid) layerType='scarf_mid';
  else if (hasScarf) layerType='scarf_top';
  else if (hasOuter) layerType='basic';
  else if (hasMid) layerType='mid_inner';
  let partKeys = LAYER_LEVELS[layerType]?.partKeys || ['top','bottom','shoes'];
  if (hasHat && !partKeys.includes('hat')) partKeys = [...partKeys,'hat'];
  return {layerType,outerType,midType,partKeys,hasOuter,hasMid,hasScarf,hasHat};
}

function pick(a){return a[Math.floor(Math.random()*a.length)];}

function pickN(a,n){return shuffle(a).slice(0,Math.min(n,a.length));}
function wPick(items,weights){const r=Math.random();let c=0;for(let i=0;i<items.length;i++){c+=weights[i];if(r<=c)return items[i];}return items[items.length-1];}
function pick4Spread(sorted){if(sorted.length<=4)return sorted.slice(0,4);const n=sorted.length,step=(n-1)/3;return[sorted[0],sorted[Math.round(step)],sorted[Math.round(step*2)],sorted[n-1]];}
function selectGradient(sorted,count,minGap){for(let a=0;a<30;a++){const sel=[pick(sorted)];const pool=shuffle(sorted.filter(c=>c!==sel[0]));for(const c of pool){if(sel.length>=count)break;if(sel.every(s=>Math.abs(L(c)-L(s))>=minGap))sel.push(c);}if(sel.length>=count)return sel.sort((a,b)=>L(a)-L(b));}return null;}

function pickWithLSpread(pool,n){for(let a=0;a<20;a++){const s=pickN(pool,n);if(s.length<n)continue;const ls=s.map(L);if(Math.max(...ls)-Math.min(...ls)>=20)return s;}const sorted=[...pool].sort((a,b)=>L(a)-L(b));return sorted.length>=n?pick4Spread(sorted):null;}
function pickShoe(style,ctx){const pool=STYLE_MOODS[style].shoes;const ok=pool.filter(s=>{const c=ctx.filter(x=>x===s).length;return c<2;});return pick(ok.length?ok:pool);}

// CRITIC (점수)
function scoreCritic(o,style){
  const cols=[o.outer,o.top,o.bottom,o.shoes];let total=0;
  const hues=cols.filter(c=>Cv(c)>=15).map(H);let f1=6;
  if(hues.length>=2){const pairs=[];for(let i=0;i<hues.length;i++)for(let j=i+1;j<hues.length;j++){const d=Math.min(Math.abs(hues[i]-hues[j]),360-Math.abs(hues[i]-hues[j]));pairs.push(d);}const avg=pairs.reduce((a,b)=>a+b,0)/pairs.length;f1=avg<=50?11:avg>=120&&avg<=180?10:avg>=80?8:5;}total+=f1;
  const ls=cols.map(L),lR=Math.max(...ls)-Math.min(...ls),avgL=ls.reduce((a,b)=>a+b)/4;let f2=6;
  if(style==='cityboy'&&avgL>65){const v=ls.reduce((a,x)=>a+(x-avgL)**2,0)/4;f2=v>100?13:v>40?10:7;}
  else if(style==='techwear'&&avgL<45){const v=ls.reduce((a,x)=>a+(x-avgL)**2,0)/4;f2=v>80?13:v>30?10:7;}
  else{f2=lR>=45?13:lR>=30?10:lR>=15?7:4;}total+=f2;
  const tc=cols.map(Cv).reduce((a,b)=>a+b)/100;total+=(tc>=0.3&&tc<=2.0)?10:tc<0.3?5:6;
  const ts=cols.map(temp),wc=ts.filter(t=>t==='w').length,cc=ts.filter(t=>t==='c').length;const bias=STYLE_MOODS[style].tempBias;let f4=5;
  if(bias==='warm')f4=wc>=2?10:wc>=1?7:3;else if(bias==='neutral')f4=(wc<=3&&cc<=3)?9:6;else f4=Math.abs(wc-cc)<=2?9:5;total+=f4;
  const m=STYLE_MOODS[style],sp=new Set([...m.darks,...m.mids,...m.lights,...m.pastels,...m.accents,...m.shoes]);let f5=0;cols.forEach(c=>{f5+=sp.has(c)?5:-2;});f5+=m.shoes.includes(o.shoes)?5:-1;f5=Math.max(0,Math.min(25,f5));total+=f5;
  let f6=10;[[0,1],[1,2],[2,3]].forEach(([i,j])=>{if(cols[i]===cols[j])f6-=4;else if(Math.abs(L(cols[i])-L(cols[j]))<5)f6-=2;});total+=Math.max(0,f6);
  const uniq=new Set(cols).size;total+=(uniq===4?10:uniq===3?7:uniq===2?4:1);

}

// STYLE FILTER
function styleFilter(style,r){
  const cols=[r.outer,r.top,r.bottom,r.shoes];const ws=cols.map(temp).filter(t=>t==='w').length;const cs=cols.map(temp).filter(t=>t==='c').length;
  const avgL=cols.map(L).reduce((a,b)=>a+b)/4;const chromatics=cols.filter(c=>Cv(c)>=40);const highChrom=cols.filter(c=>Cv(c)>=60);
  const pastels=cols.filter(c=>c.startsWith('pastel_'));const darks=cols.filter(c=>L(c)<=30);const lights=cols.filter(c=>L(c)>=80);
  const purples=cols.filter(c=>['eggplant','dark_purple','plum','mauve','purple','pastel_lavender','pastel_lilac'].includes(c));
  const pinks=cols.filter(c=>['pastel_pink','pastel_coral','pastel_peach','pastel_rose','dusty_rose','rose','salmon'].includes(c));
  const deepBlue=cols.filter(c=>['midnight','dark_blue','cobalt','indigo'].includes(c));
  const earthLight=cols.filter(c=>['cream','ivory','beige','camel','tan','pastel_peach'].includes(c));
  const heavyGreen=cols.filter(c=>['hunter_green','forest','dark_green','dark_olive'].includes(c));
  if(ws>=2&&cs>=2)return false;if(r.outer===r.top||r.top===r.bottom)return false;
  switch(style){
    case'preppy':case'ralphlook':if(pastels.length>=3)return false;if(darks.length>=3&&lights.length===0)return false;if(purples.length>=2)return false;if(pinks.length>=3)return false;break;
    case'ivy':if(pastels.length>=2)return false;if(darks.length>=3&&lights.length===0)return false;if(purples.length>=2)return false;break;
    case'dandy':if(pastels.length>=3)return false;if(highChrom.length>=2)return false;if(darks.length>=3&&lights.length===0)return false;break;
    case'oldmoney':if(pastels.length>=2)return false;if(chromatics.length>=3)return false;if(highChrom.length>=1)return false;var omH=new Set(cols.filter(c=>Cv(c)>=20).map(c=>Math.round(H(c)/60)%6));if(omH.size>=3)return false;break;
    case'minimal':if(chromatics.length>=3)return false;var mH=new Set(cols.filter(c=>Cv(c)>=25).map(c=>Math.round(H(c)/60)%6));if(mH.size>=3)return false;break;
    case'casual':if(highChrom.length>=3)return false;if(darks.length>=3&&lights.length===0&&avgL<35)return false;break;
    case'cityboy':if(avgL<50)return false;if(darks.length>=3)return false;if(heavyGreen.length>=2)return false;break;
    case'normcore':if(pastels.length>=2)return false;if(chromatics.length>=2)return false;if(highChrom.length>=1)return false;break;
    case'athleisure':if(highChrom.length>=2)return false;if(ws>=3)return false;if(lights.length>=3)return false;if(earthLight.length>=2)return false;break;
    case'amekaji':case'workwear':if(pastels.length>=1)return false;if(cs>=3)return false;if(deepBlue.length>=2)return false;break;
    case'military':if(pastels.length>=1)return false;if(cs>=3)return false;if(purples.length>=1)return false;if(pinks.length>=1)return false;break;
    case'british':if(pastels.length>=2)return false;if(cs>=3)return false;if(highChrom.length>=2)return false;break;
    case'gorpcore':if(purples.length>=2)return false;if(pinks.length>=2)return false;if(cs>=3)return false;break;
    case'street':if(pastels.length>=3)return false;break;
    case'grunge':if(pastels.length>=1)return false;if(lights.length>=3)return false;if(cs>=3)return false;break;
    case'contemporary':if(highChrom.length>=2)return false;var cH=new Set(cols.filter(c=>Cv(c)>=30).map(c=>Math.round(H(c)/60)%6));if(cH.size>=3)return false;break;
    case'techwear':if(highChrom.length>=2)return false;if(chromatics.length>=3)return false;if(ws>=3)return false;if(lights.length>=3)return false;if(earthLight.length>=2)return false;if(avgL>60)return false;break;
    case'genderless':if(highChrom.length>=2)return false;if(darks.length>=3&&lights.length===0)return false;break;
  }
  return true;
}

// EXTRA COLOR PICKER
function pickExtraColor(existingColors,style){
  const m=STYLE_MOODS[style];const pool=[...new Set([...m.darks,...m.mids,...m.lights,...m.pastels])];const existing=new Set(existingColors);
  const avgLex=existingColors.map(L).reduce((a,b)=>a+b)/existingColors.length;const exTemps=existingColors.map(temp);
  const wCount=exTemps.filter(t=>t==='w').length;const cCount=exTemps.filter(t=>t==='c').length;const dominantTemp=wCount>cCount?'w':cCount>wCount?'c':'n';
  let cands=pool.filter(c=>{if(existing.has(c))return false;const t=temp(c);const nW=wCount+(t==='w'?1:0);const nC=cCount+(t==='c'?1:0);if(nW>=2&&nC>=2)return false;const lc=L(c);const hasContrast=existingColors.some(e=>Math.abs(L(e)-lc)>=8);return hasContrast;});
  if(cands.length===0){cands=pool.filter(c=>{const t=temp(c);const nW=wCount+(t==='w'?1:0);const nC=cCount+(t==='c'?1:0);return!(nW>=2&&nC>=2);});}
  if(cands.length===0)return pick(pool);
  const scored=cands.map(c=>{let score=0;const lc=L(c),hc=H(c);const ls=existingColors.map(L);const minL=Math.min(...ls),maxL=Math.max(...ls);if(lc>minL&&lc<maxL)score+=3;existingColors.forEach(e=>{const d=Math.min(Math.abs(H(e)-hc),360-Math.abs(H(e)-hc));if(d<40)score+=1;});if(temp(c)===dominantTemp)score+=2;if(temp(c)==='n')score+=1;if(m.darks.includes(c)||m.mids.includes(c))score+=1;return{c,score};});
  scored.sort((a,b)=>b.score-a.score);const top=scored.slice(0,Math.min(8,scored.length));return pick(top).c;
}

// LAYER ADAPTER
function adaptToLayer(base4,layerType,style){
  const ld=LAYER_DEFS[layerType];const bodyN=ld.partKeys.length-(ld.partKeys.includes('shoes')?1:0);
  if(bodyN===2)return{top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};
  if(bodyN===3){switch(layerType){case'basic':return base4;case'mid_inner':return{middleware:base4.outer,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};case'scarf_top':return{scarf:base4.outer,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};default:return base4;}}
  if(bodyN===4){const existing=[base4.outer,base4.top,base4.bottom,base4.shoes];const extra=pickExtraColor(existing,style);switch(layerType){case'layered':return{outer:base4.outer,middleware:extra,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};case'scarf_basic':return{scarf:extra,outer:base4.outer,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};case'scarf_mid':return{scarf:extra,middleware:base4.outer,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};default:return base4;}}
  if(bodyN===5){const existing=[base4.outer,base4.top,base4.bottom,base4.shoes];const extra1=pickExtraColor(existing,style);const extra2=pickExtraColor([...existing,extra1],style);return{scarf:extra1,outer:base4.outer,middleware:extra2,top:base4.top,bottom:base4.bottom,shoes:base4.shoes,technique:base4.technique};}
  return base4;
}

// TECH PICKER
function pickTech(style){const w=STW[style],ts=Object.keys(w),ws=ts.map(t=>w[t]);return wPick(ts,ws);}

// GENERATE ONE
function genOne(style){for(let a=0;a<30;a++){const tn=pickTech(style),r=TECHNIQUES[tn].compose(style);if(!r||!r.outer||!r.top||!r.bottom||!r.shoes)continue;if(!COLORS[r.outer]||!COLORS[r.top]||!COLORS[r.bottom]||!COLORS[r.shoes])continue;if(!styleFilter(style,r))continue;const sc=scoreCritic(r,style);if(sc.total>=50)return{...r,technique:tn,score:sc};}return null;}

// GENERATE LAYERED
function genOneLayered(style,layerType){
  layerType=layerType||'basic';
  for(let a=0;a<30;a++){const tn=pickTech(style);const base=TECHNIQUES[tn].compose(style);if(!base||!base.outer||!base.top||!base.bottom||!base.shoes)continue;if(!COLORS[base.outer]||!COLORS[base.top]||!COLORS[base.bottom]||!COLORS[base.shoes])continue;const adapted=adaptToLayer({...base,technique:tn},layerType,style);const ld=LAYER_DEFS[layerType];const allValid=ld.partKeys.every(k=>adapted[k]&&COLORS[adapted[k]]);if(!allValid)continue;if(!styleFilter(style,adapted))continue;const sc=scoreCritic(adapted,style);if(sc.total>=50)return{...adapted,technique:tn,score:sc};}
  return null;
}

// BATCH GENERATE
function generateOutfitsLayered(style,count,layerType){
  layerType=layerType||'basic';const ld=LAYER_DEFS[layerType];const outfits=[],seen=new Set(),osCount={};let att=0;const mx=count*15;
  while(outfits.length<count&&att<mx){att++;const o=genOneLayered(style,layerType);if(!o)continue;const key=ld.partKeys.map(k=>o[k]).join('/');if(seen.has(key))continue;const outermost=o[ld.partKeys[0]];const osk=outermost+'_'+o.shoes;osCount[osk]=(osCount[osk]||0)+1;if(osCount[osk]>4)continue;const cc={};ld.partKeys.forEach(k=>{const c=o[k];cc[c]=(cc[c]||0)+1;});if(Object.values(cc).some(v=>v>=3))continue;seen.add(key);outfits.push(o);}
  return outfits.sort((a,b)=>b.score.total-a.score.total);
}

// PUBLIC API
function getDynamicCombos(style,layerType,count){
  count=count||30;const outfits=generateOutfitsLayered(style,count,layerType);
  return outfits.map((o,i)=>{const outfit={};LAYER_DEFS[layerType].partKeys.forEach(k=>{outfit[k]=o[k];});return{outfit,score:o.score?o.score.total:0,name:(STYLE_MOODS[style]?.nameKo||style)+' #'+(i+1),technique:o.technique};});
}
// ═══════════════════════════════════════════════
// 5: UI 상태 + 렌더링 + 프롬프트 빌더
// ═══════════════════════════════════════════════
const PART_KO = {outer:'아우터',middleware:'미들웨어',top:'상의',bottom:'하의',shoes:'신발',scarf:'목도리',hat:'모자'};
const PART_EN = {outer:'outer jacket/coat',middleware:'mid-layer',top:'top',bottom:'bottom',shoes:'shoes',scarf:'scarf',hat:'hat'};

let state = {step:'mood', mood:null, style:null, pickedItems:[], results:[], layerType:'basic', partKeys:['outer','top','bottom','shoes'], selectedIdx:0, promptStyle:'fullbody', gender:'neutral'};
let history = [];

function pushStep(s){history.push(state.step);state.step=s;render();}
function goBack(){if(!history.length)return;state.step=history.pop();render();}

function selectMood(m){state.mood=m;if(m){pushStep('style');}else{state.style=null;pushStep('pick');}}
function selectStyle(s){state.style=s;pushStep('pick');}
function toggleItem(id){if(state.pickedItems.includes(id))state.pickedItems=state.pickedItems.filter(x=>x!==id);else state.pickedItems.push(id);render();}

function generate(){
  const info=itemsToLayerInfo(state.pickedItems);
  state.layerType=info.layerType;state.partKeys=info.partKeys;
  const allStyles=Object.keys(STYLE_MOODS);
  const finalStyle=state.style||allStyles[Math.floor(Math.random()*allStyles.length)];
  state.results=getDynamicCombos(finalStyle,state.layerType,30);
  state.selectedIdx=0;pushStep('results');
}
function regenerate(){
  const allStyles=Object.keys(STYLE_MOODS);
  const finalStyle=state.style||allStyles[Math.floor(Math.random()*allStyles.length)];
  state.results=getDynamicCombos(finalStyle,state.layerType,30);
  state.selectedIdx=0;render();
}
function setIdx(i){state.selectedIdx=i;render();}
function setPromptStyle(s){state.promptStyle=s;render();}
function setGender(g){state.gender=g;render();}

function buildPrompt(){
  const r=state.results[state.selectedIdx];if(!r)return'';
  const outfit=r.outfit;const pk=state.partKeys;
  const modelDesc=state.gender==='male'?'a young Korean man in his 20s':state.gender==='female'?'a young Korean woman in her 20s':'a young Korean person with an androgynous look';
  const parts=[];
  for(const k of pk){const ck=outfit[k];if(!ck)continue;const c=COLORS_60[ck];if(!c)continue;parts.push('a '+c.nameEn.toLowerCase()+' ('+c.hex+') '+PART_EN[k]);}
  const desc=parts.join(', ');
  if(state.promptStyle==='fullbody')return'Fashion outfit coordination photo, full body shot of '+modelDesc+' wearing '+desc+'. Natural relaxed standing pose showing the complete outfit. Clean neutral background, soft natural lighting, high-end Korean fashion magazine editorial style. Focus on color harmony between garments, fabric textures visible, 4:5 aspect ratio for Instagram. Photorealistic, no text.';
  if(state.promptStyle==='street')return'Street style outfit coordination photo, full body shot of '+modelDesc+' wearing '+desc+'. Casual walking pose on a clean urban sidewalk with soft blurred city background. Natural daylight, warm tones, Korean street fashion editorial look. Emphasis on how the colors coordinate together as a complete outfit, 4:5 aspect ratio for Instagram. Photorealistic, no text.';
  return'Minimal studio outfit coordination photo, full body shot of '+modelDesc+' wearing '+desc+'. Relaxed standing pose against a plain white or light cream backdrop. Even studio lighting, zero distractions, sharp focus on garment colors and silhouette. Clean Korean fashion lookbook aesthetic, 4:5 aspect ratio for Instagram. Photorealistic, no text.';
}

function copyPrompt(){
  const text=buildPrompt();if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.textContent='복사됨!';
    setTimeout(()=>{btn.classList.remove('copied');btn.textContent='복사';},2000);
  });
}

// ═══ RENDER ═══
function render(){
  document.getElementById('back-btn').classList.toggle('hidden',state.step==='mood');
  document.getElementById('step-mood').classList.toggle('hidden',state.step!=='mood');
  document.getElementById('step-style').classList.toggle('hidden',state.step!=='style');
  document.getElementById('step-pick').classList.toggle('hidden',state.step!=='pick');
  document.getElementById('step-results').classList.toggle('hidden',state.step!=='results');

  if(state.step==='mood') renderMood();
  if(state.step==='style') renderStyle();
  if(state.step==='pick') renderPick();
  if(state.step==='results') renderResults();
}

function renderMood(){
  let h='<div class="card"><div class="card-title">어떤 분위기를 원하세요?</div><div class="card-desc">무드를 선택하면 맞춤 스타일을 추천해드려요</div><div class="mood-grid">';
  for(const[k,mg]of Object.entries(MOOD_GROUPS)){
    h+='<button class="mood-btn" onclick="selectMood(\''+k+'\')"><span class="icon">'+mg.icon+'</span><span class="name">'+mg.name+'</span><span class="desc">'+mg.description+'</span></button>';
  }
  h+='</div><button class="btn-dark" style="margin-top:10px" onclick="selectMood(null)">전체 스타일에서 추천받기</button></div>';
  document.getElementById('step-mood').innerHTML=h;
}

function renderStyle(){
  if(!state.mood)return;const mg=MOOD_GROUPS[state.mood];
  let h='<div class="card"><div class="card-title">'+mg.icon+' '+mg.name+' 스타일</div><div class="card-desc">원하는 스타일을 선택하세요</div><div class="style-list">';
  for(const sKey of mg.styles){
    const sg=STYLE_GUIDE[sKey];const icon=STYLE_ICONS[sKey]||'';
    h+='<button class="style-btn" onclick="selectStyle(\''+sKey+'\')"><span class="s-icon">'+icon+'</span><div><div class="s-name">'+sg.name+'</div><div class="s-sub">'+sg.subtitle+'</div></div></button>';
  }
  h+='</div><button class="btn-dark" style="margin-top:10px" onclick="selectStyle(null)">'+mg.name+' 전체에서 추천받기</button></div>';
  document.getElementById('step-style').innerHTML=h;
}

function renderPick(){
  const clothing=ITEMS_CATALOG.filter(i=>!i.slot);const accessories=ITEMS_CATALOG.filter(i=>i.slot);
  let h='<div class="card"><div class="card-title">꼭 입고 싶은 옷을 선택하세요</div><div class="card-desc">선택한 아이템 기준으로 코디를 추천합니다</div>';
  h+='<div class="chip-label">의류</div><div class="chip-group" style="margin-bottom:12px">';
  for(const item of clothing){const on=state.pickedItems.includes(item.id);h+='<button class="chip '+(on?'on':'off')+'" onclick="toggleItem(\''+item.id+'\')">'+item.emoji+' '+item.label+'</button>';}
  h+='</div><div class="chip-label">소품</div><div class="chip-group" style="margin-bottom:12px">';
  for(const item of accessories){const on=state.pickedItems.includes(item.id);h+='<button class="chip '+(on?'on':'off')+'" onclick="toggleItem(\''+item.id+'\')">'+item.emoji+' '+item.label+'</button>';}
  h+='</div>';
  if(state.pickedItems.length>0){
    const names=state.pickedItems.map(id=>{const it=ITEMS_CATALOG.find(i=>i.id===id);return it?it.label:id;}).join(', ');
    h+='<div class="summary-box">선택: '+names+' + 기본(상의, 하의, 신발)</div>';
  }
  h+='<button class="btn-primary" onclick="generate()">'+(state.pickedItems.length>0?'이 아이템으로 추천받기':'기본 구성으로 추천받기')+'</button></div>';
  document.getElementById('step-pick').innerHTML=h;
}

function renderResults(){
  if(!state.results.length){document.getElementById('step-results').innerHTML='<div class="card"><div class="card-title">결과 없음</div><p style="font-size:13px;color:#78716c">추천 결과를 생성하지 못했습니다. 다른 스타일이나 아이템 조합을 시도해보세요.</p><button class="btn-primary" style="margin-top:10px" onclick="goBack()">다시 선택하기</button></div>';return;}
  const r=state.results[state.selectedIdx];const outfit=r.outfit;
  let h='';

  // 코디 결과 카드
  h+='<div class="card"><div class="result-header"><span class="result-counter">'+(state.selectedIdx+1)+' / '+state.results.length+'</span><button class="refresh-btn" onclick="regenerate()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg> 새로 생성</button></div>';
  h+='<div class="result-info"><div class="result-name">'+r.name+'</div><div class="result-score">조화점수 '+r.score+'점</div></div>';

  // 컬러 블록
  for(const k of state.partKeys){
    const ck=outfit[k];if(!ck)continue;const c=COLORS_60[ck];if(!c)continue;
    const dark=isDarkHex(c.hex);const border=LIGHT_HEX.has(c.hex)?' light-border':'';
    h+='<div class="outfit-block'+border+'" style="background:'+c.hex+';border:1px solid transparent"><span class="part-tag" style="color:'+(dark?'#fff':'#333')+'">'+(PART_KO[k]||k)+'</span><span class="color-name" style="color:'+(dark?'#fff':'#292524')+'">'+c.name+'</span></div>';
  }

  // 네비게이션
  h+='<div class="nav-row"><button class="nav-btn" onclick="setIdx('+(state.selectedIdx-1)+')" '+(state.selectedIdx===0?'disabled':'')+'><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="dot-nav">';
  const maxDots=Math.min(10,state.results.length);
  for(let i=0;i<maxDots;i++){h+='<button class="dot '+(i===state.selectedIdx?'on':'off')+'" onclick="setIdx('+i+')"></button>';}
  if(state.results.length>10)h+='<span style="font-size:10px;color:#a8a29e">+'+( state.results.length-10)+'</span>';
  h+='</div><button class="nav-btn" onclick="setIdx('+(state.selectedIdx+1)+')" '+(state.selectedIdx>=state.results.length-1?'disabled':'')+'><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div>';
  h+='</div>';

  // 코디샷 스타일
  h+='<div class="card"><div class="card-title" style="margin-bottom:10px">코디샷 스타일</div><div class="toggle-row">';
  [{k:'fullbody',l:'전신 코디',d:'풀바디 스타일링'},{k:'street',l:'스트릿',d:'야외 배경 코디'},{k:'minimal',l:'미니멀',d:'클린 스튜디오'}].forEach(s=>{
    const on=state.promptStyle===s.k;h+='<button class="toggle-btn '+(on?'on':'off')+'" onclick="setPromptStyle(\''+s.k+'\')"><div class="t-label">'+s.l+'</div><div class="t-desc">'+s.d+'</div></button>';
  });
  h+='</div></div>';

  // 모델
  h+='<div class="card"><div class="card-title" style="margin-bottom:10px">모델</div><div class="toggle-row">';
  [{k:'male',l:'남성',d:'한국인 남성'},{k:'neutral',l:'젠더리스',d:'성별 무관'},{k:'female',l:'여성',d:'한국인 여성'}].forEach(g=>{
    const on=state.gender===g.k;h+='<button class="toggle-btn '+(on?'on':'off')+'" onclick="setGender(\''+g.k+'\')"><div class="t-label">'+g.l+'</div><div class="t-desc">'+g.d+'</div></button>';
  });
  h+='</div></div>';

  // 프롬프트 출력
  const prompt=buildPrompt();
  if(prompt){
    h+='<div class="card"><div class="prompt-header"><span class="card-title">생성된 프롬프트</span><button class="copy-btn" id="copy-btn" onclick="copyPrompt()">복사</button></div>';
    h+='<div class="prompt-box"><div class="prompt-text">'+prompt+'</div></div>';
    h+='<div class="prompt-hint"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1"/><path d="M6 3.5V6.5L8 7.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>이미지 생성 AI에 붙여넣어서 코디샷을 생성하세요</div></div>';
  }

  document.getElementById('step-results').innerHTML=h;
}

// INIT
render();


</script>
