workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: Codemagic-Admin
    
    environment:
      groups:
        - signing
        - android_signing
        - app
      vars:
        BUNDLE_ID: "kr.co.barusa.barupick"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install dependencies
        script: npm install
      
      - name: Build web app
        script: npm run build
      
      - name: Sync Capacitor
        script: npx cap sync ios
      
      - name: Update Bundle ID
        script: |
          cd ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
      
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      
      - name: Initialize keychain
        script: |
          keychain initialize
          keychain add-certificates
      
      - name: Set up profiles
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          NEW_BUILD=$(date +%s)
          echo "Setting build number to $NEW_BUILD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.2" ios/App/App/Info.plist
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $NEW_BUILD/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = 1.0.2/g" ios/App/App.xcodeproj/project.pbxproj
          cat ios/App/App/Info.plist | grep -A1 CFBundleVersion
          grep "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj | head -3

      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            archive
      
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      groups:
        - android_signing
        - app
      vars:
        PACKAGE_NAME: "kr.co.barusa.barupick"
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Install Capacitor Android
        script: npm install @capacitor/android

      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        script: npx cap sync android


      - name: Increment version code
        script: |
          cd android/app
          NEW_VERSION_CODE=$(date +%s)
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" build.gradle
          echo "Version code set to $NEW_VERSION_CODE"


      - name: Set up signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=/tmp/keystore.jks" >> android/key.properties

      - name: Verify keystore
        script: |
          echo "File size: $(wc -c < /tmp/keystore.jks) bytes"
          echo "Password length: ${#CM_KEYSTORE_PASSWORD}"
          echo "Alias: $CM_KEY_ALIAS"
          keytool -list -keystore /tmp/keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" 2>&1 || echo "KEYSTORE VERIFICATION FAILED"

      - name: Build AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

    artifacts:
      - android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - ilu62241@gmail.com
        notify:
          success: true
          failure: true
